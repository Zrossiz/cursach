  services:
    db: 
      image: postgres:15
      volumes:
        - db_data:/var/lib/postgresql/data
      environment:
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=root
        - POSTGRES_DB=cursach
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d cursach"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 10s
    
    backend:
      build: ./backend/
      ports:
        - "9000:9000"
      env_file:
        - ./backend/.env
      depends_on:
        - db
      command: sh -c "npx prisma migrate deploy && npm run start"

    frontend:
      build: ./frontend/
      ports:
        - "4173:4173"
      env_file:
        - ./frontend/.env

  volumes: 
    db_data: